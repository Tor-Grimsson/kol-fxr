<!doctype html>
<html lang="en" data-theme="dark" class="overscroll-none">
  <head>
    <meta charset="UTF-8" />
    <!-- kol-theme-boot: THEME_BOOT_SCRIPT from kol-framework, injected by vite.config.js -->
    <link rel="icon" type="image/svg+xml" href="/favicon/favicon.svg" />
    <!-- ADD TO HOME SCREEN (plan 11, apps/media's shape): saved to the home screen this runs
         without Safari's chrome; `black-translucent` puts the page under the status bar, which
         is what `viewport-fit=cover` below is for. Icons are FXR's own (2026-10-09): the glitch-split
         lettering, the favicon ink-only like KDS's, the touch icons on dark and light grounds. -->
    <!-- DARK, not light (plan 25 § 1): iOS's dark home-screen appearance darkens a web clip's light
         ground, so the light icon landed grey-on-grey; ink on #121215 survives both appearances -->
    <link rel="apple-touch-icon" href="/touch-icons/apple-touch-icon-dark.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="FXR" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#FAFAFA" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#121215" />
    <!-- maximum-scale=1 stops iOS Safari's zoom-on-focus for fields under 16px
         (the touch rail runs the md rung at 14px, see controlSize.js); iOS ≥10
         still pinch-zooms regardless, and the stage has its own pinch. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover" />
    <link rel="canonical" href="https://fxr.kolkrabbi.io/" />
    <title>FXR</title>
    <!-- SHARE METADATA (plan 25 § 2). Static on purpose: link-preview crawlers never run the app's
         JavaScript. Indexable since plan 36: canonical above, public/robots.txt + sitemap.xml. -->
    <meta name="description" content="A design compositor — frames, layers and vector tools, with generative, kinetic-type and effects layers on one engine." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Kolkrabbi" />
    <meta property="og:title" content="FXR" />
    <meta property="og:description" content="A design compositor — frames, layers and vector tools, with generative, kinetic-type and effects layers on one engine." />
    <meta property="og:url" content="https://fxr.kolkrabbi.io/" />
    <meta property="og:image" content="https://fxr.kolkrabbi.io/og/fxr.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="FXR" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="FXR" />
    <meta name="twitter:description" content="A design compositor — frames, layers and vector tools, with generative, kinetic-type and effects layers on one engine." />
    <meta name="twitter:image" content="https://fxr.kolkrabbi.io/og/fxr.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
